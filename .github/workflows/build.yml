name: Build ARM64 ComfyUI (latest)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space on runner
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          docker system prune -af || true
          df -h

      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Determine ComfyUI master HEAD commit
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/comfyanonymous/ComfyUI.git refs/heads/master | cut -f1)"
          echo "COMFYUI_REF=$SHA" >> "$GITHUB_ENV"
          echo "COMFY_SHA_SHORT=${SHA:0:12}" >> "$GITHUB_ENV"
          echo "ComfyUI master HEAD: $SHA"

      - name: Set up QEMU (for ARM64 builds)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: jayc-adi
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            COMFYUI_REF=${{ env.COMFYUI_REF }}
          tags: |
            ghcr.io/jayc-adi/comfyui:latest
            ghcr.io/jayc-adi/comfyui:sha-${{ env.COMFY_SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=min