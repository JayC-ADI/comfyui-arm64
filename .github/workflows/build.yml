name: Build ARM64 ComfyUI (latest)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    # ubuntu-latest can move; pin to reduce surprises
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Show disk (before cleanup)
        run: |
          df -h
          sudo du -sh /usr/local/lib/android 2>/dev/null || true

      # Free space on GitHub-hosted runner to avoid "No space left on device"
      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          # Remove large preinstalled toolchains we don't need
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/.ghcup || true

          # Prune docker leftovers (runner sometimes has images)
          docker system prune -af || true

          # Clean apt caches
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Show disk (after cleanup)
        run: |
          df -h
          docker system df || true

      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Determine ComfyUI master HEAD commit
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/comfyanonymous/ComfyUI.git refs/heads/master | cut -f1)"
          echo "COMFYUI_REF=$SHA" >> "$GITHUB_ENV"
          echo "COMFY_SHA_SHORT=${SHA:0:12}" >> "$GITHUB_ENV"
          echo "ComfyUI master HEAD: $SHA"

      - name: Set up QEMU (for ARM64 builds)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # REQUIRED because base image is nvcr.io
      - name: Login to NVIDIA NGC (nvcr.io)
        uses: docker/login-action@v3
        with:
          registry: nvcr.io
          username: $oauthtoken
          password: ${{ secrets.NGC_API_KEY }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: jayc-adi
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true

          # Cuts extra artifacts (often helps disk)
          provenance: false

          build-args: |
            COMFYUI_REF=${{ env.COMFYUI_REF }}

          tags: |
            ghcr.io/jayc-adi/comfyui:latest
            ghcr.io/jayc-adi/comfyui:sha-${{ env.COMFY_SHA_SHORT }}

          # Don't use GHA cache for this build; it can blow disk on big CUDA images
          no-cache: true