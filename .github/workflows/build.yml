name: Build ARM64 ComfyUI (latest)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Determine ComfyUI HEAD commit
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/comfyanonymous/ComfyUI.git refs/heads/master | cut -f1)"
          echo "COMFY_SHA=$SHA" >> "$GITHUB_ENV"
          echo "COMFY_SHA_SHORT=${SHA:0:12}" >> "$GITHUB_ENV"
          echo "ComfyUI master HEAD: $SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: jayc-adi
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/jayc-adi/comfyui:latest
            ghcr.io/jayc-adi/comfyui:sha-${{ env.COMFY_SHA_SHORT }}